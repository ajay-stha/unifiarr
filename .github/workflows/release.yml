name: Release Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "$KEYSTORE_BASE64" | base64 -d > unifiarr-release.jks
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: ./gradlew assembleRelease bundleRelease
        working-directory: android
        env:
          KEYSTORE_FILE: unifiarr-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk unifiarr.apk
      - run: cp android/app/build/outputs/bundle/release/app-release.aab unifiarr.aab
      - uses: actions/upload-artifact@v4
        with: { name: unifiarr-apk, path: unifiarr.apk }
      - uses: actions/upload-artifact@v4
        with: { name: unifiarr-aab, path: unifiarr.aab, if-no-files-found: error }
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" unifiarr.apk unifiarr.aab --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
